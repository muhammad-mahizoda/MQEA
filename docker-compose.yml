# MQEA Docker Compose конфигурация
# Автор: Мухаммад Махизода
# Таджикский национальный университет

version: '3.8'

services:
  # Основное приложение MQEA
  mqea-api:
    build: .
    container_name: mqea-api
    ports:
      - "8000:8000"
    environment:
      - MQEA_ENVIRONMENT=production
      - MQEA_DEBUG=false
      - DATABASE_URL=postgresql://mqea:mqea_password@postgres:5432/mqea_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - MONITORING_ENABLED=true
      - PROMETHEUS_PORT=9090
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./temp:/app/temp
    restart: unless-stopped
    networks:
      - mqea-network

  # Веб-интерфейс Streamlit
  mqea-web:
    build: .
    container_name: mqea-web
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "webapp/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      - MQEA_API_URL=http://mqea-api:8000
    depends_on:
      - mqea-api
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - mqea-network

  # База данных PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: mqea-postgres
    environment:
      - POSTGRES_DB=mqea_db
      - POSTGRES_USER=mqea
      - POSTGRES_PASSWORD=mqea_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - mqea-network

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: mqea-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mqea-network

  # Prometheus для мониторинга
  prometheus:
    image: prom/prometheus:latest
    container_name: mqea-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - mqea-network

  # Grafana для визуализации метрик
  grafana:
    image: grafana/grafana:latest
    container_name: mqea-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mqea_admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - mqea-network

  # Nginx для прокси
  nginx:
    image: nginx:alpine
    container_name: mqea-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - mqea-api
      - mqea-web
    restart: unless-stopped
    networks:
      - mqea-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  mqea-network:
    driver: bridge
